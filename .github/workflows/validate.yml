name: Validate shared GitHub Actions
'on':
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.4.2 PyYAML==6.0.3 ruff==0.15.22 pyrefly==1.2.0
      - run: python -m pytest docusaurus/tests -q
      - run: ruff check docusaurus
      - run: ruff format --check docusaurus
      - run: pyrefly check docusaurus/runtime
