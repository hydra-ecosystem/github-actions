name: Validate shared GitHub Actions
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install pytest==8.4.2 PyYAML==6.0.3 ruff==0.15.22 pyrefly==1.2.0
    - run: python -m pytest docusaurus/tests -q
    - run: ruff check docusaurus
    - run: ruff format --check docusaurus
    - run: pyrefly check docusaurus/runtime
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
        - '22'
        - '24'
        pnpm:
        - 11.20.0
        - 11.21.0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ matrix.node }}
    - run: 'corepack enable

        python -m pip install PyYAML==6.0.3'
    - env:
        TEST_NODE: ${{ matrix.node }}
        TEST_PNPM: ${{ matrix.pnpm }}
      run: python docusaurus/tests/verify_toolchain.py --node "$TEST_NODE" --pnpm
        "$TEST_PNPM"
