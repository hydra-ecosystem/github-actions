name: Validate shared GitHub Actions
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  repair-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        check-latest: true
    - run: npm ci --ignore-scripts --no-fund
      working-directory: repair-app
    - run: npm test
      working-directory: repair-app
    - run: npm run test:runtime
      working-directory: repair-app
    - run: npm run check
      working-directory: repair-app
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install pytest==8.4.2 PyYAML==6.0.3 ruff==0.15.22 pyrefly==1.2.0
    - run: python -m pytest node/tests -q
    - run: ruff check node
    - run: ruff format --check node
    - run: pyrefly check node/runtime
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - node: '22'
          manager: npm
          version: 11.9.0
        - node: '22'
          manager: pnpm
          version: 11.20.0
        - node: '22'
          manager: pnpm
          version: 11.21.0
        - node: '24'
          manager: npm
          version: 11.9.0
        - node: '24'
          manager: pnpm
          version: 11.20.0
        - node: '24'
          manager: pnpm
          version: 11.21.0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Select the security proposal runtime
      id: security-node
      env:
        TEST_NODE: ${{ matrix.node }}
      run: |
        python - <<'PY'
        import os
        import runpy
        security = runpy.run_path('node/runtime/node_security.py')
        version = security['latest_security_release'](os.environ['TEST_NODE'])
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'version={version}\n')
        PY
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ steps.security-node.outputs.version }}
        check-latest: true
    - run: 'corepack enable

        python -m pip install PyYAML==6.0.3'
    - name: Install pinned npm
      if: ${{ matrix.manager == 'npm' }}
      env:
        NPM_VERSION: ${{ matrix.version }}
      run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
    - env:
        TEST_NODE: ${{ matrix.node }}
        TEST_MANAGER: ${{ matrix.manager }}
        TEST_VERSION: ${{ matrix.version }}
      run: python node/tests/verify_node_project.py --node "$TEST_NODE" --manager
        "$TEST_MANAGER" --version "$TEST_VERSION"
    - name: Verify a Docusaurus production build
      if: ${{ matrix.node == '24' && matrix.manager == 'pnpm' && matrix.version ==
        '11.21.0' }}
      run: python node/tests/verify_toolchain.py --node 24 --pnpm 11.21.0
