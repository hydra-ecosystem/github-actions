name: Validate selected Node repairs
'on':
  workflow_call:
    inputs:
      request-id:
        type: string
        required: true
      pull-request:
        type: string
        required: true
      expected-head:
        type: string
        required: true
      expected-base:
        type: string
        required: true
      selections:
        type: string
        required: true
    outputs:
      candidate-artifact-id:
        description: Immutable preparation artifact ID in this run; validation and publication never replace it.
        value: ${{ jobs.prepare.outputs.candidate-artifact-id }}
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Recheck canonical PR eligibility and selections
      uses: $/node/repair
      with:
        operation: guard
        request-id: ${{ inputs.request-id }}
        pull-request: ${{ inputs.pull-request }}
        expected-head: ${{ inputs.expected-head }}
        expected-base: ${{ inputs.expected-base }}
        selections: ${{ inputs.selections }}
  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.expected-head }}
        persist-credentials: false
    - name: Validate the sealed candidate using trusted workflow code
      uses: $/node/repair
      with:
        operation: validate
        candidate-artifact-id: ${{ needs.prepare.outputs.candidate-artifact-id }}
        request-id: ${{ inputs.request-id }}
        pull-request: ${{ inputs.pull-request }}
        expected-head: ${{ inputs.expected-head }}
        expected-base: ${{ inputs.expected-base }}
        selections: ${{ inputs.selections }}
  prepare:
    name: Node repair preparation
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      npm_config_ignore_scripts: 'true'
      pnpm_config_ignore_scripts: 'true'
      npm_config_ignore_pnpmfile: 'true'
      pnpm_config_ignore_pnpmfile: 'true'
    outputs:
      candidate-artifact-id: ${{ steps.prepare.outputs.candidate-artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.expected-head }}
        persist-credentials: false
        fetch-depth: 0
    - name: Prepare the selected candidate using trusted workflow code
      id: prepare
      uses: $/node/repair
      with:
        operation: prepare
        request-id: ${{ inputs.request-id }}
        pull-request: ${{ inputs.pull-request }}
        expected-head: ${{ inputs.expected-head }}
        expected-base: ${{ inputs.expected-base }}
        selections: ${{ inputs.selections }}
    - name: Seal uploaded repair evidence
      env:
        ARTIFACT_ID: ${{ steps.prepare.outputs.candidate-artifact-id }}
        ARCHIVE_SHA256: ${{ steps.prepare.outputs.candidate-archive-sha256 }}
        CONTENT_SHA256: ${{ steps.prepare.outputs.candidate-report-sha256 }}
      run: |
        set -euo pipefail
        [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ && "$CONTENT_SHA256" =~ ^[a-f0-9]{64}$ ]]
        printf '::notice title=Node repair evidence v1::v1:%s:%s:%s\n' "$ARTIFACT_ID" "$ARCHIVE_SHA256" "$CONTENT_SHA256"
  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: node-dependency-proposal-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    env:
      TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.expected-head }}
        persist-credentials: false
        fetch-depth: 0
    - name: Publish the validated sealed candidate
      uses: $/node/repair
      with:
        operation: publish
        candidate-artifact-id: ${{ needs.prepare.outputs.candidate-artifact-id }}
        request-id: ${{ inputs.request-id }}
        pull-request: ${{ inputs.pull-request }}
        expected-head: ${{ inputs.expected-head }}
        expected-base: ${{ inputs.expected-base }}
        selections: ${{ inputs.selections }}
