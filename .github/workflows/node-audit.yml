name: Node dependency audit
'on':
  workflow_call:
    inputs:
      audit-kind:
        description: auto selects the configured cadence; security or upgrades overrides one manual run.
        type: string
        default: auto
    outputs:
      validation_passed:
        description: Whether candidate validation passed.
        value: ${{ jobs.audit.outputs.validation_passed }}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    outputs:
      validation_passed: ${{ steps.proposal.outputs.validation_passed }}
    steps:
    - name: Validate manual dispatch ref
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: "set -euo pipefail\nexpected_ref=\"refs/heads/$DEFAULT_BRANCH\"\nif [ \"\
        $GITHUB_EVENT_NAME\" = \"workflow_dispatch\" ] && [ \"$GITHUB_REF\" != \"\
        $expected_ref\" ]; then\n  echo \"::error::Manual dispatch must target the\
        \ repository default branch ($expected_ref); got $GITHUB_REF.\" >&2\n  exit\
        \ 1\nfi\n"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Audit, propose upgrades, and validate
      id: proposal
      uses: $/node/audit
      with:
        audit-kind: ${{ inputs.audit-kind }}
  configuration-issue:
    needs: audit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: node-audit-configuration-issue-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - name: Read configuration status from this run
      id: report
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: node-audit-configuration
        path: ${{ runner.temp }}/node-audit-configuration
    - name: Maintain the configuration issue
      if: ${{ steps.report.outcome == 'success' }}
      uses: $/node/configuration-issue
      env:
        GH_TOKEN: ${{ github.token }}
