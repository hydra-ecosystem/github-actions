name: Node dependency audit
'on':
  workflow_call:
    inputs:
      audit-kind:
        description: auto selects the configured cadence; security or upgrades overrides one manual run.
        type: string
        default: auto
      audit-ref:
        type: string
        default: ''
      artifact-prefix:
        type: string
        default: ''
      refresh:
        type: boolean
        default: false
      operation:
        type: string
        default: propose
      proposal-kind:
        type: string
        default: legacy
    outputs:
      validation_passed:
        description: Whether candidate validation passed.
        value: ${{ jobs.validation.outputs.validation_passed }}
      proposal_complete:
        description: Whether proposal resolution and audit evidence completed.
        value: ${{ jobs.audit.outputs.proposal_complete }}
permissions:
  contents: read
jobs:
  audit:
    name: Node audit evidence (${{ inputs.artifact-prefix || 'dependency-audit' }})
    env:
      npm_config_ignore_scripts: 'true'
      pnpm_config_ignore_scripts: 'true'
      npm_config_ignore_pnpmfile: 'true'
      pnpm_config_ignore_pnpmfile: 'true'
      npm_config_lockfile_only: 'true'
      pnpm_config_lockfile_only: 'true'
      npm_config_package_lock_only: 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    outputs:
      prepared_node: ${{ steps.seal.outputs.prepared_node }}
      proposal_complete: ${{ steps.proposal.outputs.proposal_complete }}
      report_artifact_id: ${{ steps.proposal.outputs.report_artifact_id }}
      dependencies_artifact_id: ${{ steps.proposal.outputs.dependencies_artifact_id }}
      node_update_artifact_id: ${{ steps.proposal.outputs.node_update_artifact_id }}
    steps:
    - name: Validate manual dispatch ref
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        expected_ref="refs/heads/$DEFAULT_BRANCH"
        if { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; } && [ "$GITHUB_REF" != "$expected_ref" ]; then
          echo "::error::Manual dispatch must target the repository default branch ($expected_ref); got $GITHUB_REF." >&2
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.audit-ref || github.sha }}
        persist-credentials: false
    - name: Prepare and seal audit evidence
      id: proposal
      uses: $/node/audit
      with:
        audit-kind: ${{ inputs.audit-kind }}
        artifact-prefix: ${{ inputs.artifact-prefix }}
        refresh: ${{ inputs.refresh }}
        operation: ${{ inputs.operation }}
        proposal-kind: ${{ inputs.proposal-kind }}
    - name: Seal uploaded audit evidence
      id: seal
      env:
        ARTIFACT_ID: ${{ steps.proposal.outputs.report_artifact_id }}
        ARCHIVE_SHA256: ${{ steps.proposal.outputs.report_archive_sha256 }}
        CONTENT_SHA256: ${{ steps.proposal.outputs.report_content_sha256 }}
      run: |
        set -euo pipefail
        [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ && "$CONTENT_SHA256" =~ ^[a-f0-9]{64}$ ]]
        printf '::notice title=Node audit evidence v1::v1:%s:%s:%s\n' "$ARTIFACT_ID" "$ARCHIVE_SHA256" "$CONTENT_SHA256"
        printf 'prepared_node=%s\n' "$NODE_AUDIT_NODE_VERSION" >> "$GITHUB_OUTPUT"
  validation:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    outputs:
      validation_passed: ${{ steps.validation.outputs.validation_passed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.audit-ref || github.sha }}
        persist-credentials: false
    - uses: $/node/project
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.audit.outputs.dependencies_artifact_id }}
        merge-multiple: true
        path: ${{ env.NPM_PROJECT }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ needs.audit.outputs.node_update_artifact_id }},${{ needs.audit.outputs.report_artifact_id }}
        merge-multiple: true
        path: ${{ runner.temp }}
    - name: Check the frozen candidate on a separate runner
      id: validation
      continue-on-error: ${{ inputs.operation != 'validate' }}
      uses: $/node/audit
      with:
        operation: check-prepared
        prepared-node: ${{ needs.audit.outputs.prepared_node }}
        artifact-prefix: ${{ inputs.artifact-prefix || 'dependency-audit' }}-validation
  configuration-issue:
    needs: audit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    concurrency:
      group: node-audit-configuration-issue-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
    - name: Reject stale coordinated issue reports
      if: ${{ inputs.audit-ref != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        AUDIT_SHA: ${{ inputs.audit-ref }}
        BASE_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        current=$(gh api "repos/$GH_REPO/commits/$BASE_BRANCH" --jq .sha)
        if [ "$current" != "$AUDIT_SHA" ]; then
          echo "::error::Default branch advanced; stale issue reports discarded."
          exit 1
        fi
      id: freshness
    - name: Read configuration status from this run
      id: report
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ inputs.artifact-prefix || 'node-audit' }}-configuration
        path: ${{ runner.temp }}/node-audit-configuration
      if: ${{ success() && steps.freshness.outcome != 'failure' }}
    - name: Maintain the configuration issue
      if: ${{ steps.report.outcome == 'success' && steps.freshness.outcome != 'failure' }}
      uses: $/node/configuration-issue
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Read local patch status from this run
      if: ${{ always() && !cancelled() && steps.freshness.outcome != 'failure' }}
      id: local-patches
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ inputs.artifact-prefix || 'node-audit' }}-local-patches
        path: ${{ runner.temp }}/node-audit-local-patches
    - name: Maintain the local patch notification issue
      if: ${{ always() && !cancelled() && steps.local-patches.outcome == 'success' && steps.freshness.outcome != 'failure' }}
      uses: $/node/local-patch-issue
      env:
        GH_TOKEN: ${{ github.token }}
