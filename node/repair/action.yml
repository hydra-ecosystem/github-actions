name: Selected Node pin repair
description: Guard, validate, or publish one explicitly selected batch.
inputs:
  operation:
    description: guard, prepare, or publish.
    required: true
  request-id:
    required: true
    description: Webhook delivery identifier.
  pull-request:
    required: true
    description: Managed security PR number.
  expected-head:
    required: true
    description: Approved PR head SHA.
  expected-base:
    required: true
    description: Default branch SHA at approval.
  selections:
    required: true
    description: Exact package, previous version, and target version triples.
runs:
  using: composite
  steps:
  - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
    with:
      python-version: '3.13'
  - shell: bash
    run: python -m pip install PyYAML==6.0.3
  - name: Resolve project toolchain
    if: ${{ inputs.operation == 'prepare' }}
    shell: bash
    run: python "$GITHUB_ACTION_PATH/../runtime/project.py" --github-env "$GITHUB_ENV" --resolved-config "$RUNNER_TEMP/node-repair-config.json" --configuration-report "$RUNNER_TEMP/node-repair-configuration.json"
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
    if: ${{ inputs.operation == 'prepare' }}
    with:
      node-version: ${{ env.NODE_AUDIT_NODE_VERSION }}
      check-latest: true
  - name: Enable pinned pnpm
    if: ${{ inputs.operation == 'prepare' }}
    shell: bash
    run: corepack enable
  - name: Execute selected operation
    shell: bash
    env:
      OPERATION: ${{ inputs.operation }}
      REPAIR_REQUEST: ${{ inputs.request-id }}
      REPAIR_PR: ${{ inputs.pull-request }}
      REPAIR_HEAD: ${{ inputs.expected-head }}
      REPAIR_BASE: ${{ inputs.expected-base }}
      REPAIR_SELECTIONS: ${{ inputs.selections }}
    run: python "$GITHUB_ACTION_PATH/../runtime/repair.py" "$OPERATION" --artifact "$RUNNER_TEMP/node-repair"
