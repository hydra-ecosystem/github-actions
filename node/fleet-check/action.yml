name: Check Node maintenance setup
description: Inspect listed installations as data without running project commands.
inputs:
  inventory-repository:
    default: ''
    description: Repository containing the inventory; empty selects the calling repository.
  inventory-path:
    default: defaults/node-repositories.json
    description: Repository-relative JSON inventory path.
  inventory-ref:
    default: ''
    description: Branch, tag or SHA; empty selects the inventory repository default branch.
runs:
  using: composite
  steps:
  - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
    with:
      python-version: '3.13'
  - shell: bash
    run: python -m pip install PyYAML==6.0.3
  - shell: bash
    env:
      INVENTORY_REPOSITORY: ${{ inputs.inventory-repository || github.repository }}
      INVENTORY_PATH: ${{ inputs.inventory-path }}
      INVENTORY_REF: ${{ inputs.inventory-ref }}
    run: >-
      python "$GITHUB_ACTION_PATH/../runtime/fleet.py"
      --inventory-repository "$INVENTORY_REPOSITORY"
      --inventory-path "$INVENTORY_PATH"
      --inventory-ref "$INVENTORY_REF"
      --report "$RUNNER_TEMP/node-fleet-report.json"
