name: Node audit
description: Prepare and validate a dependency proposal for the calling repository.
inputs:
  audit-kind:
    description: auto, security, or upgrades (manual dispatch only).
    default: auto
outputs:
  validation_passed:
    description: Whether frozen installation and project checks passed.
    value: ${{ steps.proposal.outputs.validation_passed }}
runs:
  using: composite
  steps:
  - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
    with:
      python-version: '3.13'
  - name: Install configuration and audit report parser
    run: python -m pip install PyYAML==6.0.3
    shell: bash
  - name: Read project configuration
    env:
      AUDIT_KIND: ${{ inputs.audit-kind }}
    run: >-
      python "$GITHUB_ACTION_PATH/../runtime/project.py" --github-env "$GITHUB_ENV"
      --resolved-config "$RUNNER_TEMP/node-audit-resolved-config.json"
      --configuration-report "$RUNNER_TEMP/node-audit-configuration.json"
      --audit-kind "$AUDIT_KIND"
    shell: bash
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
    with:
      node-version: ${{ env.NODE_AUDIT_NODE_VERSION }}
  - name: Enable the project's pinned package manager
    env:
      PACKAGE_MANAGER: ${{ env.NODE_AUDIT_MANAGER }}
      PACKAGE_MANAGER_VERSION: ${{ env.NODE_AUDIT_MANAGER_VERSION }}
    run: |
      set -euo pipefail
      if [ "$PACKAGE_MANAGER" = pnpm ]; then
        corepack enable
      else
        npm install --global "npm@$PACKAGE_MANAGER_VERSION" --ignore-scripts --no-audit --no-fund
      fi
    shell: bash
  - name: Verify the declared toolchain before dependency changes
    env:
      AUDIT_KIND: ${{ inputs.audit-kind }}
    run: >-
      python "$GITHUB_ACTION_PATH/../runtime/project.py" --verify-runtime
      --resolved-config "$RUNNER_TEMP/node-audit-resolved-config.json"
      --configuration-report "$RUNNER_TEMP/node-audit-configuration.json"
      --audit-kind "$AUDIT_KIND"
    shell: bash
  - name: Retain configuration status even when preflight fails
    if: ${{ always() && !cancelled() }}
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    with:
      name: node-audit-configuration
      if-no-files-found: ignore
      path: ${{ runner.temp }}/node-audit-configuration.json
  - name: Audit, propose upgrades, and validate
    id: proposal
    run: 'python "$GITHUB_ACTION_PATH/../runtime/templates/dependency_audit.py" --directory
      "$NPM_PROJECT" --report "$RUNNER_TEMP/dependency-audit-pr.md" --github-output
      "$GITHUB_OUTPUT"
      --validation-script "$NODE_AUDIT_VALIDATION_SCRIPT" --maintenance-mode "$NODE_AUDIT_MAINTENANCE_MODE"
      --upgrade-scope "$NODE_AUDIT_UPGRADE_SCOPE"
      --minimum-release-age-days "$NODE_AUDIT_MINIMUM_RELEASE_AGE_DAYS"

      cat "$RUNNER_TEMP/dependency-audit-pr.md" >> "$GITHUB_STEP_SUMMARY"

      '
    shell: bash
  - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    with:
      name: dependency-audit-dependencies
      if-no-files-found: error
      path: '${{ env.NPM_PROJECT }}/package.json

        ${{ env.NPM_PROJECT }}/package-lock.json

        ${{ env.NPM_PROJECT }}/pnpm-lock.yaml

        ${{ env.NPM_PROJECT }}/pnpm-workspace.yaml

        '
  - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    with:
      name: dependency-audit-report
      if-no-files-found: error
      path: ${{ runner.temp }}/dependency-audit-pr.md
